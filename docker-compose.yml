services:
  mongo:
    image: mongo:7
    container_name: sentineldb-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - sentineldb_data:/data/db
    healthcheck:
      # Initiates the single-node replica set on first run, then reports healthy once a PRIMARY exists.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { s = rs.status(); quit(s.myState === 1 ? 0 : 1) }
          catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  sentineldb_data:
